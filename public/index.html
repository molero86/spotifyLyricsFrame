<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lyrics Frame</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#1DB954">
    
    <!-- Para iOS -->
    <link rel="apple-touch-icon" href="/icons/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div id="login-container" class="content">
        <h1>Spotify Lyrics Frame</h1>
        <p>Please log in with your Spotify account to continue.</p>
        <a href="/login" class="login-button">Log in with Spotify</a>
    </div>

    <div id="main-content" class="hidden">
        <div class="background"></div>
        <div class="content">
            <div class="controls">
                <button id="toggle-play" class="play-button">
                    <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z" fill="#1DB954"/>
                    </svg>
                </button>
            </div>

            <div class="song-info">
                <h1 id="title"></h1>
                <h2 id="artist"></h2>
            </div>
            <div class="lyrics-container">
                <p id="lyrics"></p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
